<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — NutriBot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body class="auth-body">

<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">🥗</div>
      <span class="brand-name">NutriBot</span>
    </div>

    <h2 class="auth-title">Set new password</h2>
    <p class="auth-subtitle">Choose a strong password for your account.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} py-2 small">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">New password <span class="text-muted small">(min 6 characters)</span></label>
        <div class="input-group-auth">
          <i class="bi bi-lock"></i>
          <input type="password" name="password" id="pw1" class="form-control" placeholder="••••••••" required autofocus />
          <button type="button" class="toggle-pw" onclick="togglePw('pw1','eye1')"><i class="bi bi-eye" id="eye1"></i></button>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm new password</label>
        <div class="input-group-auth">
          <i class="bi bi-lock-fill"></i>
          <input type="password" name="confirm_password" id="pw2" class="form-control" placeholder="••••••••" required />
          <button type="button" class="toggle-pw" onclick="togglePw('pw2','eye2')"><i class="bi bi-eye" id="eye2"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-auth w-100">
        <i class="bi bi-shield-check me-2"></i>Reset Password
      </button>
    </form>
  </div>
</div>

<script>
function togglePw(inputId, iconId) {
  const inp  = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  inp.type   = inp.type === 'password' ? 'text' : 'password';
  icon.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}
</script>
</body>
</html>
