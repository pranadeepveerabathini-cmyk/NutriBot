<!DOCTYPE html>
<html>
<head>
    <title>NutriBot Admin</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            margin:40px;
        }

        h1{
            color:#2563eb;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:left;
        }

        th{
            background:#2563eb;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }
    </style>
</head>

<body>

<h1>NutriBot Admin Dashboard</h1>

<h3>Total Users: {{ users|length }}</h3>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Plan</th>
    <th>Admin</th>
    <th>Created</th>
</tr>

{% for user in users %}

<tr>
    <td>{{ user.id }}</td>
    <td>{{ user.name }}</td>
    <td>{{ user.email }}</td>
    <td>{{ user.plan }}</td>
    <td>{{ user.is_admin }}</td>
    <td>{{ user.created_at }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
