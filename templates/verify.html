<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — NutriBot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body class="auth-body">

<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">🥗</div>
      <span class="brand-name">NutriBot</span>
    </div>

    <div class="text-center mb-4">
      <div style="font-size:3rem;margin-bottom:12px;">📧</div>
      <h2 class="auth-title">Check your email</h2>
      <p class="auth-subtitle">We sent a 6-digit code to<br><strong>{{ email }}</strong></p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' if category == 'success' else 'warning' if category == 'warning' else 'info' }} py-2 small">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.verify_otp') }}">
      <div class="mb-4">
        <label class="form-label text-center d-block">Enter verification code</label>
        <input
          type="text"
          name="otp"
          id="otpInput"
          class="form-control text-center fw-bold"
          style="font-size:1.8rem;letter-spacing:12px;height:60px;border-radius:12px;border:2px solid #e2e8f0;"
          placeholder="••••••"
          maxlength="6"
          autocomplete="one-time-code"
          autofocus
          required
        />
        <p class="text-muted small text-center mt-2">Code expires in 10 minutes</p>
      </div>

      <button type="submit" class="btn btn-auth w-100 mb-3">
        <i class="bi bi-check2-circle me-2"></i>Verify Email
      </button>
    </form>

    <form method="POST" action="{{ url_for('auth.resend_otp') }}">
      <button type="submit" class="btn btn-outline-secondary w-100 btn-sm">
        <i class="bi bi-arrow-clockwise me-1"></i>Resend code
      </button>
    </form>

    <div class="auth-divider">or</div>
    <p class="auth-switch">
      Wrong email? <a href="{{ url_for('auth.register') }}">Register again</a>
    </p>
  </div>
</div>

<script>
// Auto-submit when 6 digits entered
document.getElementById('otpInput').addEventListener('input', function() {
  if (this.value.replace(/\D/g,'').length === 6) {
    this.value = this.value.replace(/\D/g,'');
    this.closest('form').submit();
  }
  this.value = this.value.replace(/\D/g,'');
});
</script>
</body>
</html>
